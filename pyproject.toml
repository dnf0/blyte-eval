[project]
name = "superstate-eval"
version = "0.1.0"
description = "Local assessment, differential testing, and ablation lab for Superstate and agent-rules state engines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepdiff>=8.2.0",
    "docker>=7.1.0",
    "psutil>=6.1.0",
    "pydantic>=2.10.6",
    "pytest>=8.3.4",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["lab", "tests"]
